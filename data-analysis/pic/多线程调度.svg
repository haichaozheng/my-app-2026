<svg viewBox="0 0 680 540" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>多线程调度动画</title>
  <desc>展示操作系统线程的抢占式调度、共享内存与同步阻塞</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="540" fill="#1A1A19"/>

  <text x="40" y="36" font-family="sans-serif" font-weight="500" font-size="15" fill="#EEEDFE">多线程调度与 I/O 阻塞</text>
  <text x="40" y="54" font-family="sans-serif" font-size="12" fill="#B4B2A9">线程由操作系统调度 · 共享进程内存 · 抢占式切换 · I/O 阻塞时让出 CPU</text>

  <rect x="40" y="72" width="600" height="140" rx="14" fill="#26215C" fill-opacity="0.55" stroke="#AFA9EC" stroke-width="0.5" stroke-opacity="0.5"/>
  <text x="56" y="92" font-family="sans-serif" font-weight="500" font-size="12" fill="#CECBF6">进程（共享地址空间）</text>

  <rect x="56" y="104" width="568" height="44" rx="6" fill="#2C2C2A" stroke="#888780" stroke-width="0.5"/>
  <text x="340" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#EEEDFE">共享堆 · 全局数据 · 代码段 · 文件句柄表</text>

  <rect x="56" y="156" width="180" height="44" rx="8" fill="#4A1B0C" stroke="#F0997B" stroke-width="0.5"/>
  <circle cx="78" cy="178" r="11" fill="#D85A30"/>
  <text x="78" y="182" text-anchor="middle" font-family="sans-serif" font-weight="500" font-size="11" fill="#FAECE7">T1</text>
  <text x="98" y="174" font-family="sans-serif" font-weight="500" font-size="12" fill="#FAECE7">Thread 1</text>
  <text x="98" y="190" font-family="sans-serif" font-size="11" fill="#F0997B">独立栈 · 寄存器 · PC</text>

  <rect x="250" y="156" width="180" height="44" rx="8" fill="#04342C" stroke="#5DCAA5" stroke-width="0.5"/>
  <circle cx="272" cy="178" r="11" fill="#1D9E75"/>
  <text x="272" y="182" text-anchor="middle" font-family="sans-serif" font-weight="500" font-size="11" fill="#E1F5EE">T2</text>
  <text x="292" y="174" font-family="sans-serif" font-weight="500" font-size="12" fill="#E1F5EE">Thread 2</text>
  <text x="292" y="190" font-family="sans-serif" font-size="11" fill="#5DCAA5">独立栈 · 寄存器 · PC</text>

  <rect x="444" y="156" width="180" height="44" rx="8" fill="#042C53" stroke="#85B7EB" stroke-width="0.5"/>
  <circle cx="466" cy="178" r="11" fill="#378ADD"/>
  <text x="466" y="182" text-anchor="middle" font-family="sans-serif" font-weight="500" font-size="11" fill="#E6F1FB">T3</text>
  <text x="486" y="174" font-family="sans-serif" font-weight="500" font-size="12" fill="#E6F1FB">Thread 3</text>
  <text x="486" y="190" font-family="sans-serif" font-size="11" fill="#85B7EB">独立栈 · 寄存器 · PC</text>

  <g stroke="#888780" stroke-width="0.5" stroke-dasharray="2 2" fill="none" stroke-opacity="0.4">
    <path d="M146 200 L146 145 L290 145"/>
    <path d="M340 200 L340 145 L340 145"/>
    <path d="M534 200 L534 145 L390 145"/>
  </g>

  <text x="40" y="240" font-family="sans-serif" font-weight="500" font-size="13" fill="#EEEDFE">CPU 时间片调度（操作系统抢占式）</text>
  <text x="280" y="240" font-family="sans-serif" font-size="11" fill="#888780">× OS scheduler</text>

  <rect x="120" y="264" width="500" height="26" fill="#4A1B0C" fill-opacity="0.35"/>
  <rect x="120" y="294" width="500" height="26" fill="#04342C" fill-opacity="0.35"/>
  <rect x="120" y="324" width="500" height="26" fill="#042C53" fill-opacity="0.35"/>

  <g stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="2 3" stroke-opacity="0.5">
    <line x1="120" y1="256" x2="120" y2="354"/>
    <line x1="203" y1="256" x2="203" y2="354"/>
    <line x1="287" y1="256" x2="287" y2="354"/>
    <line x1="370" y1="256" x2="370" y2="354"/>
    <line x1="453" y1="256" x2="453" y2="354"/>
    <line x1="537" y1="256" x2="537" y2="354"/>
    <line x1="620" y1="256" x2="620" y2="354"/>
  </g>

  <text x="56" y="282" font-family="sans-serif" font-weight="500" font-size="12" fill="#F0997B">T1</text>
  <text x="56" y="312" font-family="sans-serif" font-weight="500" font-size="12" fill="#5DCAA5">T2</text>
  <text x="56" y="342" font-family="sans-serif" font-weight="500" font-size="12" fill="#85B7EB">T3</text>

  <rect x="120" y="264" width="83" height="26" rx="3" fill="#D85A30"/>
  <rect x="370" y="264" width="83" height="26" rx="3" fill="#D85A30"/>

  <rect x="203" y="294" width="83" height="26" rx="3" fill="#1D9E75"/>
  <rect x="453" y="294" width="83" height="26" rx="3" fill="#1D9E75"/>

  <rect x="287" y="294" width="83" height="26" rx="3" fill="#BA7517" fill-opacity="0.18" stroke="#EF9F27" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="328" y="311" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="500" fill="#EF9F27">I/O 阻塞</text>

  <rect x="287" y="324" width="83" height="26" rx="3" fill="#378ADD"/>
  <rect x="537" y="324" width="83" height="26" rx="3" fill="#378ADD"/>

  <text x="120" y="372" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">0s</text>
  <text x="203" y="372" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">2s</text>
  <text x="287" y="372" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">4s</text>
  <text x="370" y="372" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">6s</text>
  <text x="453" y="372" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">8s</text>
  <text x="537" y="372" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">10s</text>
  <text x="620" y="372" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">12s</text>

  <g>
    <line x1="120" y1="252" x2="120" y2="354" stroke="#EEEDFE" stroke-width="1.5">
      <animate attributeName="x1" from="120" to="620" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="120" to="620" dur="12s" repeatCount="indefinite"/>
    </line>
    <circle cx="120" cy="248" r="5" fill="#EEEDFE">
      <animate attributeName="cx" from="120" to="620" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.001;0.166;0.167;1" dur="12s" repeatCount="indefinite"/>
    <text x="40" y="408" font-family="sans-serif" font-size="13" font-weight="500" fill="#F0997B">▸ T1 占用 CPU · 运行态</text>
    <text x="40" y="426" font-family="sans-serif" font-size="12" fill="#B4B2A9">时间片 1 · T1 在 CPU 上执行指令，访问共享内存</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.166;0.167;0.333;0.334;1" dur="12s" repeatCount="indefinite"/>
    <text x="40" y="408" font-family="sans-serif" font-size="13" font-weight="500" fill="#5DCAA5">▸ T2 占用 CPU · 运行态</text>
    <text x="40" y="426" font-family="sans-serif" font-size="12" fill="#B4B2A9">时间片到期 · OS 抢占并切换到 T2（上下文切换）</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.334;0.5;0.501;1" dur="12s" repeatCount="indefinite"/>
    <text x="40" y="408" font-family="sans-serif" font-size="13" font-weight="500" fill="#EF9F27">▸ T2 阻塞 · T3 接管 CPU</text>
    <text x="40" y="426" font-family="sans-serif" font-size="12" fill="#B4B2A9">T2 发起 read() 等待 I/O → 阻塞态 · OS 立刻调度 T3</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.501;0.666;0.667;1" dur="12s" repeatCount="indefinite"/>
    <text x="40" y="408" font-family="sans-serif" font-size="13" font-weight="500" fill="#F0997B">▸ T1 重新占用 CPU</text>
    <text x="40" y="426" font-family="sans-serif" font-size="12" fill="#B4B2A9">T2 仍在等待 I/O · OS 调度 T1 回到 CPU 运行</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.666;0.667;0.833;0.834;1" dur="12s" repeatCount="indefinite"/>
    <text x="40" y="408" font-family="sans-serif" font-size="13" font-weight="500" fill="#5DCAA5">▸ T2 I/O 完成 · 回到 CPU</text>
    <text x="40" y="426" font-family="sans-serif" font-size="12" fill="#B4B2A9">内核唤醒 T2 → 加入就绪队列 → OS 调度 T2 重新运行</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.833;0.834;1" dur="12s" repeatCount="indefinite"/>
    <text x="40" y="408" font-family="sans-serif" font-size="13" font-weight="500" fill="#85B7EB">▸ T3 占用 CPU · 运行态</text>
    <text x="40" y="426" font-family="sans-serif" font-size="12" fill="#B4B2A9">T2 完成一轮后让出 CPU · T3 继续运行</text>
  </g>

  <g transform="translate(40, 480)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#D85A30"/>
    <text x="20" y="11" font-family="sans-serif" font-size="11" fill="#EEEDFE">运行态（占用 CPU）</text>

    <rect x="155" y="0" width="14" height="14" rx="2" fill="#1A1A19" stroke="#EF9F27" stroke-width="1" stroke-dasharray="2 1.5"/>
    <text x="175" y="11" font-family="sans-serif" font-size="11" fill="#EEEDFE">阻塞态（等待 I/O）</text>

    <line x1="305" y1="7" x2="320" y2="7" stroke="#EEEDFE" stroke-width="1.5"/>
    <circle cx="312" cy="7" r="3" fill="#EEEDFE"/>
    <text x="328" y="11" font-family="sans-serif" font-size="11" fill="#EEEDFE">当前时间游标</text>

    <text x="450" y="11" font-family="sans-serif" font-size="11" fill="#B4B2A9">12s 循环播放</text>
  </g>
</svg>